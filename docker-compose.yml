# NIGHTFALL en una Raspberry Pi (u otro equipo en casa), publicado con Cloudflare Tunnel.
# Uso: crea un archivo .env con TUNNEL_TOKEN=... y ejecuta `docker compose up -d --build`.
services:
  nightfall:
    build: .
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Falta TUNNEL_TOKEN en el archivo .env}
    depends_on:
      - nightfall
    restart: unless-stopped
